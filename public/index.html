<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Equb Lottery</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-color: var(--telegram-bg-color, #17212b);
      --text-color: var(--telegram-text-color, #ffffff);
      --hint-color: var(--telegram-hint-color, #708499);
      --button-color: var(--telegram-button-color, #5288c1);
      --button-text-color: var(--telegram-button-text-color, #ffffff);
      --secondary-bg: var(--telegram-secondary-bg-color, #232e3c);
      --accent-gold: #f39c12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-top: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-gold);
    }

    .header p {
      font-size: 13px;
      color: var(--hint-color);
      margin-top: 4px;
    }

    /* Wheel Container */
    .wheel-wrapper {
      position: relative;
      width: min(85vw, 340px);
      height: min(85vw, 340px);
      margin: 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #e74c3c;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.4), 0 0 0 6px var(--secondary-bg);
    }

    .center-cap {
      position: absolute;
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #2c3e50, #1a252f);
      border: 3px solid var(--accent-gold);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .center-cap::after {
      content: '🎲';
      font-size: 18px;
    }

    /* Status Card */
    .status-card {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--hint-color);
      letter-spacing: 1px;
    }

    .status-value {
      font-size: 17px;
      font-weight: 600;
      margin-top: 4px;
      color: var(--text-color);
    }

    /* Controls Area */
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--button-color);
      color: var(--button-text-color);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--hint-color);
      color: var(--hint-color);
    }

    /* Winner Popup Modal */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .winner-modal.active {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }

    .winner-box {
      background: var(--secondary-bg);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      padding: 24px;
      max-width: 300px;
      width: 100%;
    }

    .winner-box h2 {
      color: var(--accent-gold);
      font-size: 22px;
      margin-bottom: 8px;
    }

    .winner-number {
      font-size: 52px;
      font-weight: 800;
      color: #2ecc71;
      margin: 12px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🇪🇹 Digital Equb Draw</h1>
    <p id="userRoleTag">Loading user profile...</p>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="700" height="700"></canvas>
    <div class="center-cap"></div>
  </div>

  <div class="status-card">
    <div class="status-title">Draw Status</div>
    <div class="status-value" id="statusText">Connecting...</div>
  </div>

  <div class="controls" id="controlsArea">
    <!-- Action buttons inject here -->
  </div>

  <!-- Winner Modal -->
  <div class="winner-modal" id="winnerModal">
    <div class="winner-box">
      <h2>🎉 Winner Drawn!</h2>
      <p style="color: var(--hint-color);">Winning Equb Number:</p>
      <div class="winner-number" id="winnerNumber">--</div>
      <button class="btn" onclick="closeModal()">Dismiss</button>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // 2. Audio Synthesizer (Ticks & Chimes)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playTickSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      } catch (e) {}
    }

    function playWinSound() {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = audioCtx.currentTime + (i * 0.08);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.3);
        });
      } catch (e) {}
    }

    // 3. Haptics
    function triggerTickHaptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
    }

    function triggerWinHaptic() {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    // 4. Wheel Canvas & State Variables
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const NUM_SEGMENTS = 100;
    let currentRotation = 0;
    let lastPassedSegment = 0;
    let isSpinning = false;
    let isAdmin = false;
    let userId = tg?.initDataUnsafe?.user?.id || 123456789;
    let localStatus = "waiting";

    const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#f1c40f', '#e67e22', '#e74c3c'];

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / NUM_SEGMENTS;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const angle = i * sliceAngle;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(i + 1, radius - 12, 4);
        ctx.restore();
      }
    }

    function animateSpinToWinner(winnerNumber, onComplete) {
      initAudio();
      isSpinning = true;
      document.getElementById('statusText').innerText = "🌀 Spinning...";

      const segmentAngle = 360 / NUM_SEGMENTS;
      const targetSegmentIndex = winnerNumber - 1;
      const targetSegmentCenter = (targetSegmentIndex * segmentAngle) + (segmentAngle / 2);
      
      const totalSpins = 360 * 6; 
      const targetDegree = totalSpins + (360 - targetSegmentCenter) - 90;

      gsap.to({ deg: currentRotation }, {
        deg: targetDegree,
        duration: 5,
        ease: "power4.out",
        onUpdate: function() {
          currentRotation = this.targets()[0].deg;
          canvas.style.transform = `rotate(${currentRotation}deg)`;

          const currentPassedSegment = Math.floor(currentRotation / segmentAngle);
          if (currentPassedSegment !== lastPassedSegment) {
            lastPassedSegment = currentPassedSegment;
            playTickSound();
            triggerTickHaptic();
          }
        },
        onComplete: function() {
          isSpinning = false;
          playWinSound();
          triggerWinHaptic();
          if (onComplete) onComplete();
        }
      });
    }

    async function authenticateUser() {
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        isAdmin = data.is_admin;

        document.getElementById('userRoleTag').innerText = isAdmin 
          ? "👑 Administrator Mode" 
          : "👤 Participant Mode";

        renderControls();
      } catch (err) {
        document.getElementById('statusText').innerText = "Ready for Draw";
        renderControls();
      }
    }

    function renderControls() {
      const container = document.getElementById('controlsArea');
      container.innerHTML = '';

      if (isAdmin) {
        container.innerHTML = `
          <button class="btn" id="spinBtn" onclick="triggerAdminSpin()">🎰 SPIN WHEEL</button>
          <button class="btn btn-secondary" onclick="resetDraw()">🔄 Reset Draw</button>
        `;
      } else {
        container.innerHTML = `
          <button class="btn btn-secondary" disabled>⏳ Waiting for Admin to spin...</button>
        `;
      }
    }

    async function triggerAdminSpin() {
      initAudio();
      const btn = document.getElementById('spinBtn');
      if (btn) btn.disabled = true;

      try {
        const res = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if (data.error && btn) btn.disabled = false;
      } catch (err) {
        if (btn) btn.disabled = false;
      }
    }

    async function resetDraw() {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
