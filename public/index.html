<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Equb Lottery</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-color: var(--telegram-bg-color, #17212b);
      --text-color: var(--telegram-text-color, #ffffff);
      --hint-color: var(--telegram-hint-color, #708499);
      --button-color: var(--telegram-button-color, #5288c1);
      --button-text-color: var(--telegram-button-text-color, #ffffff);
      --secondary-bg: var(--telegram-secondary-bg-color, #232e3c);
      --accent-gold: #f39c12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .header { text-align: center; margin-bottom: 8px; }
    .header h1 { font-size: 20px; color: var(--accent-gold); }
    .header p { font-size: 12px; color: var(--hint-color); }

    .wheel-wrapper {
      position: relative;
      width: min(75vw, 280px);
      height: min(75vw, 280px);
      margin: 10px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pointer {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-top: 20px solid #e74c3c;
      z-index: 10;
    }
    canvas#wheelCanvas {
      width: 100%; height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,0,0,0.4), 0 0 0 5px var(--secondary-bg);
    }
    .center-cap {
      position: absolute;
      width: 38px; height: 38px;
      background: #1a252f;
      border: 2px solid var(--accent-gold);
      border-radius: 50%;
      z-index: 5;
      display: flex; align-items: center; justify-content: center;
    }

    .status-card {
      background-color: var(--secondary-bg);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 320px;
      text-align: center;
      margin-bottom: 10px;
    }
    .status-value { font-size: 16px; font-weight: 600; margin-top: 2px; }

    .controls {
      width: 100%; max-width: 320px;
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 10px;
    }
    .btn {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      background-color: var(--button-color); color: var(--button-text-color);
    }
    .btn-secondary { background-color: transparent; border: 1px solid var(--hint-color); color: var(--hint-color); }

    /* History Box */
    .history-card {
      background-color: var(--secondary-bg);
      border-radius: 10px;
      padding: 10px;
      width: 100%;
      max-width: 320px;
      max-height: 120px;
      overflow-y: auto;
    }
    .history-title { font-size: 11px; color: var(--hint-color); text-transform: uppercase; margin-bottom: 4px; }
    .history-item { font-size: 13px; display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }

    /* Modal */
    .winner-modal {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85); z-index: 100;
      align-items: center; justify-content: center; text-align: center; padding: 20px;
    }
    .winner-modal.active { display: flex; }
    .winner-box { background: var(--secondary-bg); border: 2px solid var(--accent-gold); border-radius: 14px; padding: 20px; width: 100%; max-width: 280px; }
    .winner-number { font-size: 48px; font-weight: 800; color: #2ecc71; margin: 10px 0; }
  </style>
</head>
<body>

  <div class="header">
    <h1>🇪🇹 Digital Equb Draw</h1>
    <p id="userRoleTag">Authenticating...</p>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="600" height="600"></canvas>
    <div class="center-cap">🎲</div>
  </div>

  <div class="status-card">
    <div style="font-size: 10px; color: var(--hint-color); text-transform: uppercase;">Status</div>
    <div class="status-value" id="statusText">Connecting...</div>
  </div>

  <div class="controls" id="controlsArea"></div>

  <div class="history-card">
    <div class="history-title">Recent Draw History</div>
    <div id="historyList" style="font-size: 12px; color: var(--hint-color);">No draws yet</div>
  </div>

  <div class="winner-modal" id="winnerModal">
    <div class="winner-box">
      <h2>🎉 Winner!</h2>
      <div class="winner-number" id="winnerNumber">--</div>
      <button class="btn" onclick="closeModal()">Dismiss</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const NUM_SEGMENTS = 100;
    let currentRotation = 0;
    let isSpinning = false;
    let isAdmin = false;
    let userId = tg?.initDataUnsafe?.user?.id || 123456789;
    let localStatus = "waiting";

    const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#f1c40f', '#e67e22', '#e74c3c'];

    function drawWheel() {
      const centerX = canvas.width / 2, centerY = canvas.height / 2, radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / NUM_SEGMENTS;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const angle = i * sliceAngle;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fill();

        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(i + 1, radius - 10, 4);
        ctx.restore();
      }
    }

    function animateSpin(winnerNumber, onComplete) {
      isSpinning = true;
      document.getElementById('statusText').innerText = "🌀 Wheel is Spinning...";
      const segmentAngle = 360 / NUM_SEGMENTS;
      const targetCenter = ((winnerNumber - 1) * segmentAngle) + (segmentAngle / 2);
      const targetDegree = (360 * 6) + (360 - targetCenter) - 90;

      gsap.to({ deg: currentRotation }, {
        deg: targetDegree,
        duration: 4,
        ease: "power4.out",
        onUpdate: function() {
          currentRotation = this.targets()[0].deg;
          canvas.style.transform = `rotate(${currentRotation}deg)`;
        },
        onComplete: function() {
          isSpinning = false;
          if (onComplete) onComplete();
        }
      });
    }

    async function initAuth() {
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        isAdmin = data.is_admin;
        document.getElementById('userRoleTag').innerText = isAdmin ? "👑 Administrator" : "👤 Participant Member";
        renderControls();
      } catch (e) {
        document.getElementById('statusText').innerText = "Offline Mode";
      }
    }

    function renderControls() {
      const container = document.getElementById('controlsArea');
      container.innerHTML = '';
      if (isAdmin) {
        container.innerHTML = `
          <button class="btn" id="spinBtn" onclick="triggerSpin()">🎰 SPIN WHEEL</button>
          <button class="btn btn-secondary" onclick="resetDraw()">🔄 Reset Wheel</button>
        `;
      } else {
        container.innerHTML = `
          <button class="btn btn-secondary" disabled>⏳ Waiting for Admin to spin...</button>
        `;
      }
    }

    async function triggerSpin() {
      document.getElementById('spinBtn').disabled = true;
      await fetch('/api/spin', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
      });
    }

    async function resetDraw() {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
      });
      closeModal();
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        // Update History List
        if (data.history && data.history.length > 0) {
          const listHtml = data.history.map(h => `<div class="history-item"><span>Winner: #${h.winner}</span><span style="color:var(--hint-color);">${h.time}</span></div>`).join('');
          document.getElementById('historyList').innerHTML = listHtml;
        }

        if (data.status === "spinning" && !isSpinning && localStatus !== "spinning") {
          localStatus = "spinning";
          animateSpin(data.winner, () => {
            localStatus = "finished";
            showWinner(data.winner);
          });
        } else if (data.status === "waiting" && localStatus !== "waiting") {
          localStatus = "waiting";
          document.getElementById('statusText').innerText = "Ready for Draw";
          closeModal();
          renderControls();
        } else if (data.status === "waiting" && !isSpinning) {
          document.getElementById('statusText').innerText = "Ready for Draw";
        }
      } catch (e) {}
    }

    function showWinner(num) {
      document.getElementById('statusText').innerText = `Winner: #${num}`;
      document.getElementById('winnerNumber').innerText = num;
      document.getElementById('winnerModal').classList.add('active');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.remove('active');
    }

    drawWheel();
    initAuth();
    setInterval(pollStatus, 1500);
  </script>
</body>
</html>
