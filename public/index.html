<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equb Lottery</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Using reliable CDNs for the wheel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/winwheel@2.8.0/Bin/Winwheel.js"></script>
    
    <style>
        body {
            background-color: #17212b; 
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #wheelContainer {
            /* Border to see where the wheel should be */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
        }
        #spinBtn {
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #2ea6ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #spinBtn:active { background-color: #1c85d6; }
    </style>
</head>
<body>

    <h2 id="statusText">Equb Lottery</h2>
    
    <div id="wheelContainer">
        <canvas id="canvas" width="300" height="300"></canvas>
    </div>
    
    <button id="spinBtn">SPIN</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 

        const colors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];
        let segments = [];
        for (let i = 1; i <= 100; i++) {
            segments.push({
                'fillStyle': colors[i % colors.length],
                'text': i.toString(),
                'textFillStyle': 'white'
            });
        }

        // Wait for the page to fully load before drawing
        window.onload = function() {
            let theWheel = new Winwheel({
                'canvasId': 'canvas',
                'numSegments': 100,
                'outerRadius': 140, 
                'textFontSize': 10,
                'textOrientation': 'curved',
                'textAlignment': 'outer',
                'segments': segments,
                'animation': {
                    'type': 'spinToStop',
                    'duration': 8, 
                    'spins': 10, 
                    'callbackFinished': alertPrize
                }
            });

            document.getElementById('spinBtn').addEventListener('click', function() {
                theWheel.startAnimation();
                document.getElementById('statusText').innerText = "Spinning...";
            });

            function alertPrize() {
                let winningSegment = theWheel.getIndicatedSegment();
                document.getElementById('statusText').innerText = `🎉 Winner: Ticket ${winningSegment.text}! 🎉`;
            }
        };
    </script>
</body>
</html>
