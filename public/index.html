<script>
  // Initialize Telegram WebApp SDK
  const tg = window.Telegram?.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
  }

  // --- AUDIO SYNTHESIZER (No external MP3 files needed) ---
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new AudioContext();
    }
  }

  // Plays a short mechanical click/tick sound
  function playTickSound() {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.03);

      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.03);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.03);
    } catch (e) {
      console.warn("Audio error:", e);
    }
  }

  // Plays a triumph chime when a winner lands
  function playWinSound() {
    if (!audioCtx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
      notes.forEach((freq, index) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.value = freq;

        const startTime = audioCtx.currentTime + (index * 0.08);
        gain.gain.setValueAtTime(0.2, startTime);
        gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(startTime);
        osc.stop(startTime + 0.3);
      });
    } catch (e) {
      console.warn("Win audio error:", e);
    }
  }

  // --- HAPTIC FEEDBACK HELPERS ---
  function triggerTickHaptic() {
    if (tg?.HapticFeedback) {
      // Light impact on each segment tick
      tg.HapticFeedback.impactOccurred('light');
    }
  }

  function triggerWinHaptic() {
    if (tg?.HapticFeedback) {
      // Strong success pattern on win
      tg.HapticFeedback.notificationOccurred('success');
    }
  }

  // --- CANVAS & WHEEL STATE ---
  const canvas = document.getElementById('wheelCanvas');
  const ctx = canvas.getContext('2d');
  const NUM_SEGMENTS = 100;
  let currentRotation = 0;
  let lastPassedSegment = 0;
  let isSpinning = false;

  const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#f1c40f', '#e67e22', '#e74c3c'];

  function drawWheel() {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = canvas.width / 2 - 10;
    const sliceAngle = (2 * Math.PI) / NUM_SEGMENTS;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < NUM_SEGMENTS; i++) {
      const angle = i * sliceAngle;
      ctx.beginPath();
      ctx.fillStyle = colors[i % colors.length];
      ctx.moveTo(centerX, centerY);
      ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
      ctx.closePath();
      ctx.fill();

      ctx.save();
      ctx.translate(centerX, centerY);
      ctx.rotate(angle + sliceAngle / 2);
      ctx.textAlign = "right";
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 12px sans-serif";
      ctx.fillText(i + 1, radius - 12, 4);
      ctx.restore();
    }
  }

  // Smooth wheel spin with audio & haptics on segment boundaries
  function animateSpinToWinner(winnerNumber, onComplete) {
    initAudio();
    isSpinning = true;
    document.getElementById('statusText').innerText = "🌀 Spinning...";

    const segmentAngle = 360 / NUM_SEGMENTS;
    const targetSegmentIndex = winnerNumber - 1;
    const targetSegmentCenter = (targetSegmentIndex * segmentAngle) + (segmentAngle / 2);
    
    const totalSpins = 360 * 6; 
    const targetDegree = totalSpins + (360 - targetSegmentCenter) - 90;

    gsap.to({ deg: currentRotation }, {
      deg: targetDegree,
      duration: 5,
      ease: "power4.out",
      onUpdate: function() {
        currentRotation = this.targets()[0].deg;
        canvas.style.transform = `rotate(${currentRotation}deg)`;

        // Detect each segment boundary crossed to play tick + vibration
        const currentPassedSegment = Math.floor(currentRotation / segmentAngle);
        if (currentPassedSegment !== lastPassedSegment) {
          lastPassedSegment = currentPassedSegment;
          playTickSound();
          triggerTickHaptic();
        }
      },
      onComplete: function() {
        isSpinning = false;
        playWinSound();
        triggerWinHaptic();
        if (onComplete) onComplete();
      }
    });
  }
</script>
