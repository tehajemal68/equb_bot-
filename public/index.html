<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Equb Lottery Draw</title>
    <!-- This script connects your web page to the Telegram App -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- This is the library that makes the wheel spin -->
    <script src="https://cdn.jsdelivr.net/npm/winwheel@2.8.0/Bin/Winwheel.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    
    <style>
        body {
            background-color: #17212b; /* Telegram Dark Mode Color */
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        canvas {
            max-width: 90vw;
            max-height: 90vw;
        }
        #spinBtn {
            margin-top: 20px;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            color: white;
            background-color: #2ea6ff;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #spinBtn:active {
            background-color: #1c85d6;
        }
    </style>
</head>
<body>

    <h2 id="statusText">Equb Lottery</h2>
    <canvas id="canvas" width="400" height="400"></canvas>
    <button id="spinBtn">SPIN</button>

    <script>
        // 1. Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Make it full screen

        // 2. Define the colors for the wheel slices
        const colors = ["#e74c3c", "#3498db", "#2ecc71", "#f1c40f", "#9b59b6", "#e67e22"];

        // 3. Generate 100 ticket numbers
        let segments = [];
        for (let i = 1; i <= 100; i++) {
            segments.push({
                'fillStyle': colors[i % colors.length],
                'text': i.toString(),
                'textFillStyle': 'white'
            });
        }

        // 4. Create the Wheel
        let theWheel = new Winwheel({
            'numSegments': 100,        // How many slices
            'outerRadius': 190,        // Size of the wheel
            'textFontSize': 12,
            'textOrientation': 'curved',
            'textAlignment': 'outer',
            'segments': segments,
            'animation': {
                'type': 'spinToStop',
                'duration': 8,         // Spin for 8 seconds
                'spins': 10,           // Spin 10 times before stopping
                'callbackFinished': alertPrize
            }
        });

        // 5. Spin Button Logic
        document.getElementById('spinBtn').addEventListener('click', function() {
            // In the future, only the Admin will see this button.
            theWheel.startAnimation();
            document.getElementById('statusText').innerText = "Spinning...";
        });

        // 6. When the wheel stops, show the winner
        function alertPrize() {
            let winningSegment = theWheel.getIndicatedSegment();
            document.getElementById('statusText').innerText = `🎉 Winner: Ticket ${winningSegment.text}! 🎉`;
            
            // Here, you will eventually tell the Python bot who won
            // tg.sendData(winningSegment.text); 
        }
    </script>
</body>
</html>
