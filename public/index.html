<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HALAL EQUB</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- GSAP Animation Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --bg-color: var(--telegram-bg-color, #17212b);
      --text-color: var(--telegram-text-color, #ffffff);
      --hint-color: var(--telegram-hint-color, #708499);
      --button-color: var(--telegram-button-color, #5288c1);
      --button-text-color: var(--telegram-button-text-color, #ffffff);
      --secondary-bg: var(--telegram-secondary-bg-color, #232e3c);
      --accent-gold: #f39c12;
      --accent-green: #2ecc71;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      margin: 0;
      overflow-x: hidden;
    }

    /* Wheel Styling */
    .wheel-container {
      position: relative;
      width: min(82vw, 320px);
      height: min(82vw, 320px);
      margin: 12px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #e74c3c;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.5), 0 0 0 6px var(--secondary-bg);
    }

    .center-cap {
      position: absolute;
      width: 44px;
      height: 44px;
      background: radial-gradient(circle, #2c3e50, #1a252f);
      border: 3px solid var(--accent-gold);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      font-size: 20px;
    }

    /* Modal Animation */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      backdrop-filter: blur(4px);
    }

    .winner-modal.active {
      display: flex;
      animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- App Header -->
  <div class="text-center w-full max-w-sm">
    <h1 class="text-2xl font-bold text-amber-500 tracking-wide">🇪🇹 HALAL EQUB</h1>
    <p id="userRoleTag" class="text-xs text-slate-400 mt-1">Connecting to session...</p>
  </div>

  <!-- Wheel Canvas Area -->
  <div class="wheel-container">
    <div class="wheel-pointer"></div>
    <canvas id="wheelCanvas" width="700" height="700"></canvas>
    <div class="center-cap">🎲</div>
  </div>

  <!-- Status Banner -->
  <div class="w-full max-w-sm bg-slate-800/80 rounded-xl p-3 text-center border border-slate-700/50 shadow-md">
    <div class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">STATUS</div>
    <div id="statusText" class="text-base font-bold text-white mt-0.5">Initializing...</div>
  </div>

  <!-- Control Buttons Area (Rendered via JS based on Admin/User status) -->
  <div id="controlsArea" class="w-full max-w-sm flex flex-col gap-2.5 my-2">
    <button class="w-full py-3 px-4 rounded-xl font-bold bg-slate-700 text-slate-400 cursor-not-allowed opacity-60" disabled>
      ⏳ Authenticating...
    </button>
  </div>

  <!-- Draw History Box -->
  <div class="w-full max-w-sm bg-slate-800/80 rounded-xl p-3 border border-slate-700/50 shadow-md max-h-36 flex flex-col">
    <div class="flex justify-between items-center mb-2">
      <span class="text-[10px] uppercase tracking-wider text-slate-400 font-semibold">RECENT DRAW HISTORY</span>
      <span id="historyCount" class="text-[10px] text-amber-500 font-semibold">0 Draws</span>
    </div>
    <div id="historyList" class="overflow-y-auto space-y-1.5 text-xs text-slate-300 pr-1">
      <div class="text-center py-2 text-slate-500">No draws performed yet</div>
    </div>
  </div>

  <!-- Winner Modal Popup -->
  <div id="winnerModal" class="winner-modal">
    <div class="bg-slate-800 border-2 border-amber-500 rounded-2xl p-6 text-center max-w-xs w-full shadow-2xl">
      <h2 class="text-2xl font-bold text-amber-500 mb-1">🎉 Winner Drawn!</h2>
      <p class="text-xs text-slate-400">Winning Equb Number:</p>
      <div id="winnerNumber" class="text-6xl font-extrabold text-emerald-400 my-4">--</div>
      <button onclick="closeModal()" class="w-full py-3 bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold rounded-xl transition-all">
        Acknowledge
      </button>
    </div>
  </div>

  <script>
    // 1. Initialize Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Extract Telegram User or Default Sandbox User
    const userId = tg?.initDataUnsafe?.user?.id || 123456789;
    let isAdmin = false;
    let isSpinning = false;
    let currentRotation = 0;
    let lastPassedSegment = 0;
    let localStatus = "waiting";

    // Audio Context Synthesizer (No external audio files required)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
    }

    function playTickSound() {
      if (!audioCtx) return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(580, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(120, audioCtx.currentTime + 0.025);
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.025);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.025);
      } catch (e) {}
    }

    function playWinSound() {
      if (!audioCtx) return;
      try {
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          const startTime = audioCtx.currentTime + (idx * 0.09);
          gain.gain.setValueAtTime(0.2, startTime);
          gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.35);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(startTime);
          osc.stop(startTime + 0.35);
        });
      } catch (e) {}
    }

    // Wheel Canvas Setup
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const NUM_SEGMENTS = 100;
    const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#f1c40f', '#e67e22', '#e74c3c'];

    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / NUM_SEGMENTS;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const angle = i * sliceAngle;
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fill();

        // Draw numbers
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.fillText(i + 1, radius - 10, 4);
        ctx.restore();
      }
    }

    // Smooth GSAP Wheel Spin Logic
    function animateSpin(winnerNumber, onComplete) {
      initAudio();
      isSpinning = true;
      document.getElementById('statusText').innerText = "🌀 Live Draw in Progress...";

      const segmentAngle = 360 / NUM_SEGMENTS;
      const targetSegmentIndex = winnerNumber - 1;
      const targetSegmentCenter = (targetSegmentIndex * segmentAngle) + (segmentAngle / 2);
      
      const totalSpins = 360 * 7; 
      const targetDegree = totalSpins + (360 - targetSegmentCenter) - 90;

      gsap.to({ deg: currentRotation }, {
        deg: targetDegree,
        duration: 5,
        ease: "power4.out",
        onUpdate: function() {
          currentRotation = this.targets()[0].deg;
          canvas.style.transform = `rotate(${currentRotation}deg)`;

          const currentPassedSegment = Math.floor(currentRotation / segmentAngle);
          if (currentPassedSegment !== lastPassedSegment) {
            lastPassedSegment = currentPassedSegment;
            playTickSound();
            if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          }
        },
        onComplete: function() {
          isSpinning = false;
          playWinSound();
          if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
          if (onComplete) onComplete();
        }
      });
    }

    // Backend Connection & Polling Logic
    async function initAuth() {
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });

        if (!res.ok) throw new Error("API Auth Failed");
        const data = await res.json();
        isAdmin = data.is_admin;

        document.getElementById('userRoleTag').innerText = isAdmin 
          ? "👑 Administrator Access" 
          : "👤 Participant Member";

       } catch (err) {
  console.error("API Auth Failed:", err);
  isAdmin = false; // If the server fails, treat them as a regular user
  document.getElementById('userRoleTag').innerText = "👤 Participant Member";
} finally {
        renderControls();
        pollStatus();
      }
    }

    function renderControls() {
      const container = document.getElementById('controlsArea');
      container.innerHTML = '';

      if (isAdmin) {
        container.innerHTML = `
          <button id="spinBtn" onclick="triggerSpin()" class="w-full py-3.5 px-4 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-600 hover:to-amber-700 text-slate-950 font-extrabold text-base rounded-xl shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
            🎰 SPIN WHEEL NOW
          </button>
          <button onclick="resetDraw()" class="w-full py-2.5 px-4 bg-transparent border border-slate-600 text-slate-400 hover:text-white font-semibold text-xs rounded-xl transition-all">
            🔄 Reset Wheel State
          </button>
        `;
      } else {
        container.innerHTML = `
          <button class="w-full py-3.5 px-4 bg-slate-800 border border-slate-700/80 text-amber-500 font-bold text-sm rounded-xl text-center shadow-inner cursor-wait flex items-center justify-center gap-2" disabled>
            <span class="animate-pulse">⏳ Waiting for Admin to spin...</span>
          </button>
        `;
      }
    }

    async function triggerSpin() {
      initAudio();
      const spinBtn = document.getElementById('spinBtn');
      if (spinBtn) spinBtn.disabled = true;

      try {
        const res = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if (data.error && spinBtn) spinBtn.disabled = false;
      } catch (err) {
        // Local simulation fallback
        const mockWinner = Math.floor(Math.random() * 100) + 1;
        animateSpin(mockWinner, () => showWinner(mockWinner));
      }
    }

    async function resetDraw() {
      try {
        await fetch('/api/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
      } catch(e) {}
      closeModal();
      document.getElementById('statusText').innerText = "Ready for Draw";
    }

    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        if (!res.ok) throw new Error("Status endpoint unavailable");
        const data = await res.json();

        // Update history drawer
        if (data.history) {
          updateHistoryUI(data.history);
        }

        if (data.status === "spinning" && !isSpinning && localStatus !== "spinning") {
          localStatus = "spinning";
          animateSpin(data.winner, () => {
            localStatus = "finished";
            showWinner(data.winner);
          });
        } else if (data.status === "waiting" && localStatus !== "waiting") {
          localStatus = "waiting";
          document.getElementById('statusText').innerText = "Ready for Draw";
          closeModal();
          renderControls();
        } else if (data.status === "waiting" && !isSpinning) {
          document.getElementById('statusText').innerText = "Ready for Draw";
        }
      } catch (err) {
        if (!isSpinning && localStatus === "waiting") {
          document.getElementById('statusText').innerText = "Ready for Draw";
        }
      }
    }

    function updateHistoryUI(historyList) {
      const container = document.getElementById('historyList');
      document.getElementById('historyCount').innerText = `${historyList.length} Draws`;

      if (historyList.length === 0) {
        container.innerHTML = `<div class="text-center py-2 text-slate-500">No draws performed yet</div>`;
        return;
      }

      container.innerHTML = historyList.map((item, idx) => `
        <div class="flex justify-between items-center py-1 px-2 bg-slate-900/50 rounded border border-slate-800">
          <span class="font-bold text-emerald-400">Winner #${item.winner}</span>
          <span class="text-[10px] text-slate-500">${item.time || 'Recently'}</span>
        </div>
      `).join('');
    }

    function showWinner(num) {
      document.getElementById('statusText').innerText = `Winner: Number ${num}!`;
      document.getElementById('winnerNumber').innerText = num;
      document.getElementById('winnerModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.remove('active');
    }

    // Init App
    drawWheel();
    initAuth();
    setInterval(pollStatus, 1500);
  </script>
</body>
</html>
```
