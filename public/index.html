<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Digital Equb Lottery</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- GSAP for smooth high-performance wheel animation on mobile -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

  <style>
    :root {
      --bg-color: var(--telegram-bg-color, #17212b);
      --text-color: var(--telegram-text-color, #ffffff);
      --hint-color: var(--telegram-hint-color, #708499);
      --button-color: var(--telegram-button-color, #5288c1);
      --button-text-color: var(--telegram-button-text-color, #ffffff);
      --secondary-bg: var(--telegram-secondary-bg-color, #232e3c);
      --accent-gold: #f39c12;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      min-height: 100vh;
      padding: 16px;
      overflow: hidden;
    }

    .header {
      text-align: center;
      margin-top: 8px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: var(--accent-gold);
    }

    .header p {
      font-size: 13px;
      color: var(--hint-color);
      margin-top: 4px;
    }

    /* Wheel Container */
    .wheel-wrapper {
      position: relative;
      width: min(88vw, 360px);
      height: min(88vw, 360px);
      margin: 20px 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Top Pointer Indicator */
    .pointer {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 24px solid #e74c3c;
      z-index: 10;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    canvas#wheelCanvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.4), 0 0 0 6px var(--secondary-bg);
    }

    .center-cap {
      position: absolute;
      width: 48px;
      height: 48px;
      background: radial-gradient(circle, #2c3e50, #1a252f);
      border: 3px solid var(--accent-gold);
      border-radius: 50%;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .center-cap::after {
      content: '🎲';
      font-size: 20px;
    }

    /* Status Card */
    .status-card {
      background-color: var(--secondary-bg);
      border-radius: 12px;
      padding: 12px 20px;
      width: 100%;
      max-width: 360px;
      text-align: center;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .status-title {
      font-size: 12px;
      text-transform: uppercase;
      color: var(--hint-color);
      letter-spacing: 1px;
    }

    .status-value {
      font-size: 18px;
      font-weight: 600;
      margin-top: 4px;
      color: var(--text-color);
    }

    /* Controls */
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      background-color: var(--button-color);
      color: var(--button-text-color);
      transition: opacity 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-secondary {
      background-color: transparent;
      border: 1px solid var(--hint-color);
      color: var(--hint-color);
    }

    /* Winner Banner */
    .winner-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.85);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .winner-modal.active {
      display: flex;
      animation: fadeIn 0.3s ease-out;
    }

    .winner-box {
      background: var(--secondary-bg);
      border: 2px solid var(--accent-gold);
      border-radius: 16px;
      padding: 24px;
      max-width: 300px;
      width: 100%;
    }

    .winner-box h2 {
      color: var(--accent-gold);
      font-size: 24px;
      margin-bottom: 8px;
    }

    .winner-number {
      font-size: 56px;
      font-weight: 800;
      color: #2ecc71;
      margin: 12px 0;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🇪🇹 Digital Equb Draw</h1>
    <p id="userRoleTag">Loading user profile...</p>
  </div>

  <div class="wheel-wrapper">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="700" height="700"></canvas>
    <div class="center-cap"></div>
  </div>

  <div class="status-card">
    <div class="status-title">Draw Status</div>
    <div class="status-value" id="statusText">Connecting...</div>
  </div>

  <div class="controls" id="controlsArea">
    <!-- Admin or User buttons inject here -->
  </div>

  <!-- Winner Modal -->
  <div class="winner-modal" id="winnerModal">
    <div class="winner-box">
      <h2>🎉 Winner Drawn!</h2>
      <p style="color: var(--hint-color);">Winning Equb Number:</p>
      <div class="winner-number" id="winnerNumber">--</div>
      <button class="btn" onclick="closeModal()">Dismiss</button>
    </div>
  </div>

  <script>
    // Initialize Telegram WebApp SDK
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    // Canvas & Wheel State
    const canvas = document.getElementById('wheelCanvas');
    const ctx = canvas.getContext('2d');
    const NUM_SEGMENTS = 100;
    let currentRotation = 0; // In degrees
    let isSpinning = false;
    let isAdmin = false;
    let userId = null;
    let pollInterval = null;
    let localStatus = "waiting";

    // Colors palette for 100 segments
    const colors = ['#1abc9c', '#2ecc71', '#3498db', '#9b59b6', '#34495e', '#f1c40f', '#e67e22', '#e74c3c'];

    // Read User Info from Telegram SDK
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      userId = tg.initDataUnsafe.user.id;
    } else {
      // Fallback for browser testing
      userId = 123456789; 
    }

    // Render 100-segment wheel on Canvas
    function drawWheel() {
      const centerX = canvas.width / 2;
      const centerY = canvas.height / 2;
      const radius = canvas.width / 2 - 10;
      const sliceAngle = (2 * Math.PI) / NUM_SEGMENTS;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < NUM_SEGMENTS; i++) {
        const angle = i * sliceAngle;
        
        // Draw Segment
        ctx.beginPath();
        ctx.fillStyle = colors[i % colors.length];
        ctx.moveTo(centerX, centerY);
        ctx.arc(centerX, centerY, radius, angle, angle + sliceAngle);
        ctx.closePath();
        ctx.fill();
        ctx.strokeRect(0, 0, canvas.width, canvas.height);

        // Draw Text (Numbers 1-100)
        ctx.save();
        ctx.translate(centerX, centerY);
        ctx.rotate(angle + sliceAngle / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 12px sans-serif";
        ctx.fillText(i + 1, radius - 12, 4);
        ctx.restore();
      }
    }

    // Spin animation to specific winning number (1 - 100)
    function animateSpinToWinner(winnerNumber, onComplete) {
      isSpinning = true;
      document.getElementById('statusText').innerText = "🌀 Spinning...";

      const segmentAngle = 360 / NUM_SEGMENTS;
      // Wheel top (270 deg) is where pointer points.
      // Target angle centers the winning segment under pointer.
      const targetSegmentIndex = winnerNumber - 1;
      const targetSegmentCenter = (targetSegmentIndex * segmentAngle) + (segmentAngle / 2);
      
      // Calculate target rotation degrees (5 full spins + offset)
      const totalSpins = 360 * 6; 
      const targetDegree = totalSpins + (360 - targetSegmentCenter) - 90;

      gsap.to({ deg: currentRotation }, {
        deg: targetDegree,
        duration: 5,
        ease: "power4.out",
        onUpdate: function() {
          currentRotation = this.targets()[0].deg;
          canvas.style.transform = `rotate(${currentRotation}deg)`;
        },
        onComplete: function() {
          isSpinning = false;
          if (onComplete) onComplete();
        }
      });
    }

    // Authenticate with Flask backend
    async function authenticateUser() {
      try {
        const res = await fetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        isAdmin = data.is_admin;

        document.getElementById('userRoleTag').innerText = isAdmin 
          ? "👑 Administrator Mode" 
          : "👤 Participant Mode";

        renderControls();
      } catch (err) {
        console.error("Auth error:", err);
        document.getElementById('statusText').innerText = "Connection Error";
      }
    }

    // Render UI controls based on Admin status
    function renderControls() {
      const container = document.getElementById('controlsArea');
      container.innerHTML = '';

      if (isAdmin) {
        container.innerHTML = `
          <button class="btn" id="spinBtn" onclick="triggerAdminSpin()">🎰 SPIN WHEEL</button>
          <button class="btn btn-secondary" onclick="resetDraw()">🔄 Reset Draw</button>
        `;
      } else {
        container.innerHTML = `
          <button class="btn btn-secondary" disabled>⏳ Waiting for Admin to spin...</button>
        `;
      }
    }

    // Admin Action: Trigger spin API
    async function triggerAdminSpin() {
      const btn = document.getElementById('spinBtn');
      if (btn) btn.disabled = true;

      try {
        const res = await fetch('/api/spin', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: userId })
        });
        const data = await res.json();
        if (data.error) {
          alert(data.error);
          if (btn) btn.disabled = false;
        }
      } catch (err) {
        console.error("Spin trigger failed:", err);
        if (btn) btn.disabled = false;
      }
    }

    // Admin Action: Reset draw
    async function resetDraw() {
      await fetch('/api/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
      });
      closeModal();
    }

    // Live Polling Synchronization (Server-Sent Events / Polling simulation)
    async function pollStatus() {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        // Detect state change from backend
        if (data.status === "spinning" && !isSpinning && localStatus !== "spinning") {
          localStatus = "spinning";
          animateSpinToWinner(data.winner, () => {
            localStatus = "finished";
            showWinner(data.winner);
          });
        } else if (data.status === "waiting" && localStatus !== "waiting") {
          localStatus = "waiting";
          document.getElementById('statusText').innerText = "Waiting for Next Round";
          closeModal();
          renderControls();
        } else if (data.status === "waiting" && !isSpinning) {
          document.getElementById('statusText').innerText = "Ready for Draw";
        }
      } catch (err) {
        console.error("Polling error:", err);
      }
    }

    function showWinner(winnerNumber) {
      document.getElementById('statusText').innerText = `Winner: Number ${winnerNumber}!`;
      document.getElementById('winnerNumber').innerText = winnerNumber;
      document.getElementById('winnerModal').classList.add('active');
      if (tg && tg.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred('success');
      }
    }

    function closeModal() {
      document.getElementById('winnerModal').classList.remove('active');
    }

    // Initialize App
    drawWheel();
    authenticateUser();
    pollInterval = setInterval(pollStatus, 1500); // Poll backend every 1.5s
  </script>
</body>
</html>
